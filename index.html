<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Uma coisinha para você ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <div class="coracao">❤️</div>

        <h1 id="titulo">
            Tenho uma pergunta importantíssima...
        </h1>

        <p id="mensagem">
            Você me ama? 🥺
        </p>

        <div class="botoes" id="botoes">

            <button id="sim">
                SIM ❤️
            </button>

            <button id="nao">
                NÃO 😭
            </button>

        </div>

        <button id="continuar" style="display: none;">
            Continuar 💌
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
